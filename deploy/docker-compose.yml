services:
  routetimer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ROUTETIMER_DB_NAME:-routetimer}
      POSTGRES_USER: ${ROUTETIMER_DB_USER:-routetimer}
      POSTGRES_PASSWORD: ${ROUTETIMER_DB_PASSWORD:?set ROUTETIMER_DB_PASSWORD}
    volumes:
      - routetimer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - routetimer-private

  routetimer-garmin-adapter:
    image: ghcr.io/jamiemitchellconsultants/routetimer-garmin-adapter:${ROUTETIMER_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - routetimer-private
      - garmin-egress

  routetimer:
    image: ghcr.io/jamiemitchellconsultants/routetimer:${ROUTETIMER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      routetimer-db:
        condition: service_healthy
      routetimer-garmin-adapter:
        condition: service_healthy
    environment:
      ConnectionStrings__RouteTimer: Host=routetimer-db;Database=${ROUTETIMER_DB_NAME:-routetimer};Username=${ROUTETIMER_DB_USER:-routetimer};Password=${ROUTETIMER_DB_PASSWORD:?set ROUTETIMER_DB_PASSWORD}
      Database__ApplyMigrations: "true"
      Auth__Mode: Keycloak
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:?set KEYCLOAK_AUTHORITY}
      GarminAdapter__BaseUrl: http://routetimer-garmin-adapter:8081
      Garmin__TokenEncryptionKey: ${ROUTETIMER_GARMIN_TOKEN_KEY:?set ROUTETIMER_GARMIN_TOKEN_KEY}
      # Optional, unlike the Garmin key above: RouteTimer starts fine without it, and saving a
      # Google Maps API key is simply unavailable until this is set.
      GoogleMaps__KeyEncryptionKey: ${ROUTETIMER_GOOGLE_MAPS_KEY_ENCRYPTION_KEY:-}
      # "Open in PaceTracker". Off unless deliberately enabled, and both values below are
      # deliberately plain :- expansions rather than :? guards: with the feature disabled an empty
      # expansion is correct, and with it enabled the application's own startup validation rejects
      # the empty value and stops the container. That keeps "enabled but unconfigured" a startup
      # failure rather than a rider-facing one.
      #
      # Both live in an untracked, permission-restricted deploy/.env -- never in this file. The PEM
      # is multi-line, so write it in .env with single quotes around the whole value, opening the
      # quote before the PEM's first BEGIN line and closing it after its last END line, with the
      # base64 body in between exactly as generated. No placeholder is shown here on purpose:
      # tracked files hold no key material, real or example.
      #
      # See docs/routepacer-handoff.md for key generation and the deployment order.
      RoutePacerHandoff__Enabled: ${ROUTEPACER_HANDOFF_ENABLED:-false}
      RoutePacerHandoff__RelayUploadKey: ${ROUTEPACER_RELAY_UPLOAD_KEY:-}
      RoutePacerHandoff__SigningPrivateKeyPem: ${ROUTEPACER_SIGNING_PRIVATE_KEY_PEM:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks:
      - routetimer-private
      - mcp-public

volumes:
  routetimer_postgres:

networks:
  routetimer-private:
    internal: true
  garmin-egress:
    driver: bridge
  mcp-public:
    external: true
    name: mcp-public
