services:
  routetimer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ROUTETIMER_DB_NAME:-routetimer}
      POSTGRES_USER: ${ROUTETIMER_DB_USER:-routetimer}
      POSTGRES_PASSWORD: ${ROUTETIMER_DB_PASSWORD:?set ROUTETIMER_DB_PASSWORD}
    volumes:
      - routetimer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - routetimer-private

  routetimer-garmin-adapter:
    image: ghcr.io/jamiemitchellconsultants/routetimer-garmin-adapter:${ROUTETIMER_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - routetimer-private
      - garmin-egress

  routetimer:
    image: ghcr.io/jamiemitchellconsultants/routetimer:${ROUTETIMER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      routetimer-db:
        condition: service_healthy
      routetimer-garmin-adapter:
        condition: service_healthy
    environment:
      ConnectionStrings__RouteTimer: Host=routetimer-db;Database=${ROUTETIMER_DB_NAME:-routetimer};Username=${ROUTETIMER_DB_USER:-routetimer};Password=${ROUTETIMER_DB_PASSWORD:?set ROUTETIMER_DB_PASSWORD}
      Database__ApplyMigrations: "true"
      Auth__Mode: Keycloak
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:?set KEYCLOAK_AUTHORITY}
      GarminAdapter__BaseUrl: http://routetimer-garmin-adapter:8081
      Garmin__TokenEncryptionKey: ${ROUTETIMER_GARMIN_TOKEN_KEY:?set ROUTETIMER_GARMIN_TOKEN_KEY}
      # Optional, unlike the Garmin key above: RouteTimer starts fine without it, and saving a
      # Google Maps API key is simply unavailable until this is set.
      GoogleMaps__KeyEncryptionKey: ${ROUTETIMER_GOOGLE_MAPS_KEY_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks:
      - routetimer-private
      - mcp-public

volumes:
  routetimer_postgres:

networks:
  routetimer-private:
    internal: true
  garmin-egress:
    driver: bridge
  mcp-public:
    external: true
    name: mcp-public
