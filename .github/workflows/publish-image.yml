name: Publish container images

# Runs the full test suite, then -- only if it passes -- builds both container images (the
# RouteTimer app and its Garmin Connect adapter) and publishes them to GHCR. Both images are
# versioned together from the same commit, so they always carry the same set of tags; the
# deployment models pin them together via one ROUTETIMER_IMAGE_TAG variable.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Run the .NET test suite
        run: dotnet test RouteTimer.slnx --no-restore -p:UseSharedCompilation=false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the route visualization test suite
        working-directory: src/RouteTimer.Client
        run: |
          npm ci
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the Garmin adapter test suite
        working-directory: garmin-adapter
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]" --no-build-isolation
          pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: routetimer
            context: .
          - image: routetimer-garmin-adapter
            context: ./garmin-adapter
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
